<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兔子跳跃 · 动作预览</title><style>*{box-sizing:border-box}body{margin:0;background:#f3efdf;color:#4c5039;font-family:"PingFang SC",sans-serif}main{max-width:1100px;padding:28px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}header small{font-size:10px;letter-spacing:3px;color:#98977e}.sub{font-size:13px;color:#8a8e75;margin:9px 0 22px}.stage{border:1px solid #d6dec4;border-radius:16px;overflow:hidden;background:linear-gradient(#e2edf0,#e9edda 65%,#d2dbb5);position:relative}canvas{display:block;width:100%;aspect-ratio:2/1}.phase{position:absolute;left:24px;top:20px;font-weight:700;font-size:15px}.description{position:absolute;left:24px;top:45px;font-size:11px;color:#7e8a73}.badge{position:absolute;right:24px;top:22px;font-size:10px;color:#82927b;letter-spacing:2px}.toolbar{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}button,select{font:inherit;font-size:12px;padding:9px 14px;border:1px solid #c8cfb8;border-radius:7px;background:#fffaf0;color:#627050;cursor:pointer}button.primary{background:#60795a;color:white;border-color:#60795a}input{flex:1;min-width:160px;accent-color:#71845b}.steps{display:flex;gap:8px;margin-top:16px}.steps button{flex:1;font-size:11px;padding:10px 5px}.steps .active{background:#e0e7ce;border-color:#8d9f70;font-weight:700}.note{font-size:11px;line-height:1.8;color:#9a9c85;margin-top:18px}a{color:#7d8d65}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#e8eddf;color:#809173;font-size:13px}@media(max-width:600px){main{padding:16px}h1{font-size:20px}.description{max-width:60%;font-size:9px}.badge{font-size:8px}.phase{font-size:12px}.steps{flex-wrap:wrap}.steps button{min-width:29%}.toolbar{gap:7px}header small{display:none}}</style></head><body><main><header><h1>兔子怎么跳？</h1><small>MOTION STUDY / 01</small></header><p class="sub">先把一个动作做自然。可慢放、暂停，或拖动进度逐段看。</p><div class="stage"><canvas id="study" width="2000" height="1000" aria-label="一只四足兔子的跳跃动作预览"></canvas><div class="phase" id="phase">准备</div><div class="description" id="description">身体放低，后腿准备蹬地</div><div class="badge">单角色动作样片</div><div id="loading">正在准备动作素材…</div></div><div class="toolbar"><button class="primary" id="play">暂停</button><button id="again">重播一次</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5" selected>0.5 倍慢放</option><option value="0.25">0.25 倍慢放</option></select><input id="scrub" aria-label="动作进度" type="range" min="0" max="1.8" step="0.001" value="0"></div><div class="steps"><button data-t="0.12">① 伏低蓄力</button><button data-t="0.29">② 后腿蹬伸</button><button data-t="0.52">③ 身体展开</button><button data-t="0.73">④ 空中收腿</button><button data-t="1.03">⑤ 前爪落地</button><button data-t="1.18">⑥ 后腿跟进</button></div><p class="note">这是独立动作预览，尚未替换双人游戏。重点确认身体姿态、腿的收放和落地顺序。<br><a href="/">返回胡萝卜大盗</a></p></main><script src="jump-study.js"></script></body></html>
